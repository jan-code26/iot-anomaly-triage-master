<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Walkthrough — IoT Anomaly Triage</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #20243a;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #8892a4;
      --accent: #4f8ef7;
      --red: #f56565;
      --yellow: #ecc94b;
      --green: #48bb78;
      --red-bg: rgba(245,101,101,0.12);
      --yellow-bg: rgba(236,201,75,0.10);
      --green-bg: rgba(72,187,120,0.10);
      --accent-bg: rgba(79,142,247,0.10);
      --sidebar-w: 220px;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    /* ── JARGON TOOLTIPS ── */
    .jargon {
      border-bottom: 1px dashed var(--muted);
      cursor: help;
      position: relative;
      white-space: nowrap;
    }
    .jargon::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #252838;
      border: 1px solid #3a3d52;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 400;
      font-style: normal;
      line-height: 1.55;
      padding: 8px 12px;
      border-radius: 8px;
      width: max-content;
      max-width: 260px;
      white-space: normal;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s;
      z-index: 999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .jargon:hover::after, .jargon:focus::after { opacity: 1; }

    /* ── TOP BAR ── */
    /* ── SHARED HEADER ── */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex; align-items: center; height: 48px;
      flex-shrink: 0; z-index: 100;
    }
    .header-brand {
      display: flex; align-items: center;
      padding-right: 20px;
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }
    .header-brand h1 { font-size: 15px; font-weight: 600; }
    .header-brand h1 span { color: var(--accent); }
    header nav { display: flex; align-items: stretch; }
    header nav a {
      display: flex; align-items: center;
      padding: 0 16px; height: 48px;
      font-size: 13px; color: var(--muted);
      text-decoration: none; white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
    }
    header nav a:hover { color: var(--text); }
    header nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Demo/Live mode pill — lives in sidebar */
    .mode-pill {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px; gap: 2px;
      margin: 8px 16px 4px;
    }
    .mode-btn {
      flex: 1; padding: 4px 10px;
      border-radius: 16px; border: none;
      background: transparent; color: var(--muted);
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .mode-btn.active { background: var(--accent); color: #fff; }

    /* ── PROGRESS ── */
    #progress-wrap {
      height: 3px;
      background: var(--border);
      flex-shrink: 0;
    }
    #progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    /* ── MAIN LAYOUT ── */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 0;
    }
    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 16px 8px;
    }
    .nav-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.12s;
      border-left: 3px solid transparent;
    }
    .nav-step:hover { background: rgba(79,142,247,0.06); }
    .nav-step.active {
      background: var(--accent-bg);
      border-left-color: var(--accent);
    }
    .nav-step.done { opacity: 0.7; }
    .step-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .nav-step.active .step-dot {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .nav-step.done .step-dot {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      font-size: 13px;
    }
    .nav-step-label {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }
    .nav-step.active .nav-step-label { color: var(--text); font-weight: 500; }

    /* ── CONTENT AREA ── */
    #content-wrap {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    #step-content {
      flex: 1;
      padding: 36px 48px;
      max-width: 900px;
    }
    .step-num {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .step-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .step-story {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.75;
      max-width: 680px;
      margin-bottom: 28px;
    }
    .step-story strong { color: var(--text); }

    /* ── CALLOUT ── */
    .callout {
      border-radius: 10px;
      padding: 14px 18px;
      margin: 20px 0;
      font-size: 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .callout.red { background: var(--red-bg); border: 1px solid rgba(245,101,101,0.25); color: var(--red); }
    .callout.green { background: var(--green-bg); border: 1px solid rgba(72,187,120,0.25); color: var(--green); }
    .callout.blue { background: var(--accent-bg); border: 1px solid rgba(79,142,247,0.25); color: var(--accent); }
    .callout.yellow { background: var(--yellow-bg); border: 1px solid rgba(236,201,75,0.25); color: var(--yellow); }
    .callout-icon { font-size: 18px; line-height: 1; flex-shrink: 0; }
    .callout-body { line-height: 1.55; }
    .callout-body strong { font-weight: 700; }

    /* ── MATH EXPAND ── */
    .math-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      background: none;
      border: none;
      padding: 4px 0;
      margin-top: 8px;
      transition: color 0.15s;
    }
    .math-toggle:hover { color: var(--accent); }
    .math-toggle .arrow { transition: transform 0.2s; }
    .math-toggle.open .arrow { transform: rotate(90deg); }
    .math-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
    }
    .math-panel.open { display: block; }
    .math-panel code {
      background: var(--surface2);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 12px;
      color: var(--accent);
    }
    .math-panel table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .math-panel th { text-align: left; color: var(--text); font-weight: 600; border-bottom: 1px solid var(--border); padding: 6px 8px; }
    .math-panel td { padding: 5px 8px; border-bottom: 1px solid rgba(42,45,58,0.5); }

    /* ── CHART CONTAINER ── */
    .chart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }
    .chart-box h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    /* Chart.js requires a fixed-height parent when maintainAspectRatio:false */
    .chart-wrap { position: relative; height: 220px; }
    .chart-wrap.tall { height: 260px; }
    .chart-wrap.sm { height: 160px; }
    .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    /* ── SENSOR GRID ── */
    .sensor-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 20px 0;
    }
    .sensor-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .causal-cell {
      border-color: rgba(79,142,247,0.35);
      background: rgba(79,142,247,0.04);
    }
    .sensor-name {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .causal-tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      background: var(--accent-bg);
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .sensor-val {
      font-size: 17px;
      font-weight: 700;
      font-family: "SF Mono", Consolas, monospace;
      color: var(--text);
      margin-bottom: 3px;
    }
    .sensor-desc {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.3;
    }
    /* legacy badge classes kept for any future use */
    .badge-red { background: var(--red-bg); color: var(--red); }
    .badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
    .badge-green { background: var(--green-bg); color: var(--green); }

    /* ── SCORE BAR ── */
    .score-display {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin: 20px 0;
      text-align: center;
    }
    .score-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .score-number { font-size: 52px; font-weight: 800; font-family: "SF Mono", Consolas, monospace; transition: color 0.6s; }
    .score-bar-track {
      height: 10px;
      background: var(--surface2);
      border-radius: 5px;
      margin: 12px 0;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 1s ease, background 0.6s;
    }
    .score-decision { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }

    /* ── VERDICT SPLIT ── */
    .verdict-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 20px 0;
    }
    .verdict-card {
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    .verdict-card.bad { background: var(--red-bg); border: 1px solid rgba(245,101,101,0.3); }
    .verdict-card.good { background: var(--green-bg); border: 1px solid rgba(72,187,120,0.3); }
    .verdict-icon { font-size: 40px; margin-bottom: 10px; }
    .verdict-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .verdict-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .verdict-card.bad .verdict-title { color: var(--red); }
    .verdict-card.good .verdict-title { color: var(--green); }
    .verdict-detail { font-size: 13px; color: var(--muted); }

    /* ── IMPACT COUNTER ── */
    .impact-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin: 20px 0;
      text-align: center;
    }
    .impact-num {
      font-size: 60px;
      font-weight: 800;
      color: var(--green);
      font-family: "SF Mono", Consolas, monospace;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .impact-desc { font-size: 15px; color: var(--muted); max-width: 260px; line-height: 1.5; text-align: left; }
    .impact-desc strong { color: var(--text); display: block; font-size: 18px; margin-bottom: 4px; }

    /* ── TYPEWRITER ── */
    .llm-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin: 20px 0;
    }
    .llm-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .llm-badge {
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid rgba(79,142,247,0.3);
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .llm-model { font-size: 12px; color: var(--muted); }
    .llm-text { font-size: 16px; line-height: 1.7; color: var(--text); min-height: 60px; }
    .cursor { display: inline-block; width: 2px; height: 18px; background: var(--accent); animation: blink 0.8s infinite; vertical-align: middle; margin-left: 2px; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }

    /* ── CLUSTER TABLE ── */
    .cluster-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cluster-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
    .cluster-table td { padding: 8px 12px; border-bottom: 1px solid rgba(42,45,58,0.5); }
    .cluster-table tr:hover td { background: var(--surface2); }
    .cluster-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .cluster-table tr.highlight-row td { background: var(--accent-bg); font-weight: 600; }

    /* ── BOTTOM NAV ── */
    #bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--surface2); border-color: var(--muted); }
    .nav-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .nav-btn.primary:hover { opacity: 0.88; }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .step-counter { font-size: 13px; color: var(--muted); }

    /* ── LIVE MODE PANEL ── */
    #live-panel {
      display: none;
      background: var(--surface);
      border: 1px solid rgba(236,201,75,0.3);
      border-radius: 10px;
      padding: 14px 18px;
      margin: 0 0 20px;
      font-size: 13px;
    }
    #live-panel.visible { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #live-panel label { color: var(--muted); font-weight: 500; }
    #live-panel input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      color: var(--text);
      font-size: 13px;
      width: 180px;
    }
    #live-panel .connect-btn {
      padding: 5px 14px;
      background: var(--yellow);
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    #live-status { font-size: 12px; font-weight: 600; }
    #live-status.ok { color: var(--green); }
    #live-status.err { color: var(--red); }

    /* ── MISC ── */
    .ops-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
    .op-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      text-align: center;
    }
    .op-val { font-size: 28px; font-weight: 800; color: var(--accent); font-family: "SF Mono", Consolas, monospace; }
    .op-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .op-context { font-size: 11px; color: var(--accent); margin-top: 2px; font-weight: 600; }

    .residual-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0; }
    .residual-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 10px;
      text-align: center;
    }
    .residual-sensor { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .residual-z { font-size: 20px; font-weight: 800; font-family: "SF Mono", Consolas, monospace; color: var(--green); }
    .residual-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .physics-result {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin: 16px 0;
    }
    .physics-icon { font-size: 40px; }
    .physics-detail h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .physics-stat { font-size: 13px; color: var(--muted); }
    .physics-stat span { color: var(--text); font-family: "SF Mono", Consolas, monospace; }

    @media (max-width: 768px) {
      #sidebar { display: none; }
      #step-content { padding: 20px 20px; }
      .chart-row, .verdict-split { grid-template-columns: 1fr; }
      .sensor-grid { grid-template-columns: repeat(2, 1fr); }
      .residual-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-brand">
    <h1>🛩️ <span>IoT</span> Anomaly Triage</h1>
  </div>
  <nav>
    <a href="/">Showcase</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/tutorial" class="active">Tutorial</a>
  </nav>
</header>

<!-- PROGRESS BAR -->
<div id="progress-wrap">
  <div id="progress-fill" style="width:14.3%"></div>
</div>

<!-- MAIN LAYOUT -->
<div id="layout">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="mode-pill">
      <button class="mode-btn active" id="btn-demo" onclick="setMode('demo')">Demo</button>
      <button class="mode-btn" id="btn-live" onclick="setMode('live')">Live</button>
    </div>
    <div class="sidebar-label">Steps</div>
    <div class="nav-step active" id="nav-1" onclick="goToStep(1)">
      <div class="step-dot" id="dot-1">1</div>
      <div class="nav-step-label">Meet the Engine</div>
    </div>
    <div class="nav-step" id="nav-2" onclick="goToStep(2)">
      <div class="step-dot" id="dot-2">2</div>
      <div class="nav-step-label">The Old Way</div>
    </div>
    <div class="nav-step" id="nav-3" onclick="goToStep(3)">
      <div class="step-dot" id="dot-3">3</div>
      <div class="nav-step-label">Why It Fails</div>
    </div>
    <div class="nav-step" id="nav-4" onclick="goToStep(4)">
      <div class="step-dot" id="dot-4">4</div>
      <div class="nav-step-label">Regime Scoring</div>
    </div>
    <div class="nav-step" id="nav-5" onclick="goToStep(5)">
      <div class="step-dot" id="dot-5">5</div>
      <div class="nav-step-label">Physics Veto</div>
    </div>
    <div class="nav-step" id="nav-6" onclick="goToStep(6)">
      <div class="step-dot" id="dot-6">6</div>
      <div class="nav-step-label">LLM Explanation</div>
    </div>
    <div class="nav-step" id="nav-7" onclick="goToStep(7)">
      <div class="step-dot" id="dot-7">7</div>
      <div class="nav-step-label">The Verdict</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content-wrap">
    <div id="step-content"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div id="bottom-nav">

// ============================================================
// NAVIGATION
// ============================================================
function goToStep(n) {
  if (n < 1 || n > 7) return;
  destroyCharts();
  currentStep = n;
  if (n > maxVisited) maxVisited = n;
  renderStep(n);
  updateNav(n);
  location.hash = 'step=' + n;
}

function nextStep() { goToStep(currentStep + 1); }
function prevStep() { goToStep(currentStep - 1); }

function renderStep(n) {
  const stepDef = STEPS[n - 1];
  document.getElementById('step-content').innerHTML = stepDef.render();
  if (mode === 'live') {
    const lp = document.getElementById('live-panel');
    if (lp) lp.classList.add('visible');
  }
  if (stepDef.onEnter) stepDef.onEnter();
}

function updateNav(n) {
  // Sidebar
  for (let i = 1; i <= 7; i++) {
    const el = document.getElementById('nav-' + i);
    const dot = document.getElementById('dot-' + i);
    el.classList.remove('active', 'done');
    if (i === n) { el.classList.add('active'); dot.textContent = i; }
    else if (i < n) { el.classList.add('done'); dot.textContent = '✓'; }
    else { dot.textContent = i; }
  }
  // Progress bar
  document.getElementById('progress-fill').style.width = (n / 7 * 100) + '%';
  // Counter
  document.getElementById('step-counter').textContent = 'Step ' + n + ' of 7';
  // Buttons
  document.getElementById('btn-back').disabled = (n === 1);
  const btnNext = document.getElementById('btn-next');
  if (n === 7) {
    btnNext.textContent = '✓ Done';
    btnNext.onclick = () => { window.location.href = '/showcase'; };
  } else {
    btnNext.textContent = 'Next →';
    btnNext.onclick = nextStep;
  }
}

// ============================================================
// MODE TOGGLE
// ============================================================
function setMode(m) {
  mode = m;
  document.getElementById('btn-demo').classList.toggle('active', m === 'demo');
  document.getElementById('btn-live').classList.toggle('active', m === 'live');
  const lp = document.getElementById('live-panel');
  if (lp) {
    lp.classList.toggle('visible', m === 'live');
  }
}

async function connectLive() {
  const url = document.getElementById('backend-url').value.trim();
  const status = document.getElementById('live-status');
  status.textContent = 'Connecting…';
  status.className = '';
  try {
    const r = await fetch(url + '/health', { signal: AbortSignal.timeout(4000) });
    if (r.ok) {
      status.textContent = '● Connected';
      status.className = 'ok';
    } else {
      throw new Error('Non-OK response');
    }
  } catch {
    status.textContent = '✗ Unreachable — using demo data';
    status.className = 'err';
    setMode('demo');
  }
}

// ============================================================
// CHART HELPERS
// ============================================================
function destroyCharts() {
  Object.values(activeCharts).forEach(c => c.destroy());
  activeCharts = {};
}

function renderGlobalChart() {
  const ctx = document.getElementById('chart-global');
  if (!ctx) return;
  const top5 = GLOBAL_ZSCORES.slice(0, 5);
  const labels = top5.map(d => d.sensor.replace('sensor_', 'sensor '));
  const zs = top5.map(d => d.z);
  const colors = zs.map(z => z > 100 ? 'rgba(245,101,101,0.75)' : 'rgba(236,201,75,0.75)');
  const borders = zs.map(z => z > 100 ? 'rgba(245,101,101,1)' : 'rgba(236,201,75,1)');
  activeCharts.global = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Global z-score (|value − FD001 mean| / σ)',
        data: zs,
        backgroundColor: colors,
        borderColor: borders,
        borderWidth: 1.5,
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#8892a4', font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const d = top5[ctx.dataIndex];
              return [
                ` z = ${d.z.toFixed(1)}`,
                ` Engine 90: ${d.val}`,
                ` FD001 mean: ${d.mean}`,
              ];
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#2a2d3a' },
          ticks: { color: '#8892a4' },
          title: { display: true, text: 'z-score  (normal threshold ≈ 2)', color: '#8892a4', font: { size: 11 } }
        },
        y: { grid: { color: '#2a2d3a' }, ticks: { color: '#8892a4' } }
      }
    },
    plugins: [{
      id: 'threshold-line',
      afterDraw(chart) {
        const { ctx: c, chartArea: { top, bottom }, scales: { x } } = chart;
        const xPos = x.getPixelForValue(2);
        c.save();
        c.setLineDash([5, 4]);
        c.strokeStyle = 'rgba(72,187,120,0.6)';
        c.lineWidth = 1.5;
        c.beginPath();
        c.moveTo(xPos, top);
        c.lineTo(xPos, bottom);
        c.stroke();
        c.fillStyle = 'rgba(72,187,120,0.8)';
        c.font = '10px system-ui';
        c.fillText('normal (z=2)', xPos + 4, top + 12);
        c.restore();
      }
    }]
  });
}

function renderRegimeChart() {
  const ctx = document.getElementById('chart-regime');
  if (!ctx) return;
  // Generate jittered points per centroid
  const rng = (seed) => { let x=seed; return () => { x=Math.sin(x)*10000; return x-Math.floor(x); }; };
  const datasets = CENTROIDS.map((c, i) => {
    const r = rng(i * 7.3 + 1.1);
    const pts = Array.from({length: 30}, () => ({
      x: c.op1 + (r()-0.5)*0.8,
      y: c.op2 + (r()-0.5)*0.015
    }));
    return {
      label: 'Cluster ' + c.id + (c.id === 5 ? ' ★' : ''),
      data: pts,
      backgroundColor: c.id === 5 ? 'rgba(159,122,234,0.6)' : c.color + '55',
      borderColor: c.color,
      pointRadius: c.id === 5 ? 5 : 4,
      pointStyle: c.id === 5 ? 'triangle' : 'circle',
    };
  });
  // Add Engine 90 star point
  datasets.push({
    label: 'Engine 90 ★',
    data: [{x: ENGINE.op1, y: ENGINE.op2}],
    backgroundColor: '#fff',
    borderColor: '#9f7aea',
    pointRadius: 10,
    pointStyle: 'star',
    borderWidth: 2,
  });
  activeCharts.regime = new Chart(ctx, {
    type: 'scatter',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 10 } },
        tooltip: { callbacks: { label: (ctx) => `(${ctx.parsed.x.toFixed(1)}, ${ctx.parsed.y.toFixed(3)})` } }
      },
      scales: {
        x: { title: { display: true, text: 'op_setting_1 (altitude)', color: '#8892a4' }, grid: { color: '#2a2d3a' }, ticks: { color: '#8892a4' } },
        y: { title: { display: true, text: 'op_setting_2 (Mach)', color: '#8892a4' }, grid: { color: '#2a2d3a' }, ticks: { color: '#8892a4' } }
      }
    }
  });
}

function renderPhysicsChart() {
  const ctx = document.getElementById('chart-physics');
  if (!ctx) return;
  // Fit a simple linear regression to show the trend
  const n = PHYSICS_SCATTER.length;
  const mx = PHYSICS_SCATTER.reduce((a,b)=>a+b.x,0)/n;
  const my = PHYSICS_SCATTER.reduce((a,b)=>a+b.y,0)/n;
  const cov = PHYSICS_SCATTER.reduce((a,b)=>a+(b.x-mx)*(b.y-my),0);
  const vx = PHYSICS_SCATTER.reduce((a,b)=>a+(b.x-mx)**2,0);
  const slope = cov/vx;
  const intercept = my - slope*mx;
  const x0=41.4, x1=42.7;
  activeCharts.physics = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [
        {
          label: 'Cluster 5 training engines',
          data: PHYSICS_SCATTER,
          backgroundColor: 'rgba(79,142,247,0.4)',
          borderColor: 'rgba(79,142,247,0.7)',
          pointRadius: 5,
        },
        {
          label: 'Isentropic fit',
          type: 'line',
          data: [{x:x0, y:slope*x0+intercept},{x:x1, y:slope*x1+intercept}],
          borderColor: 'rgba(79,142,247,0.4)',
          borderWidth: 1.5,
          borderDash: [5,3],
          pointRadius: 0,
          fill: false,
        },
        {
          label: 'Engine 90 (cycle 91)',
          data: [{x: 42.02, y: 9.3274}],
          backgroundColor: '#fff',
          borderColor: '#48bb78',
          pointRadius: 10,
          pointStyle: 'star',
          borderWidth: 2,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#8892a4', font: { size: 11 }, boxWidth: 10 } } },
      scales: {
        x: { title: { display: true, text: 'sensor_11 (HPC outlet pressure)', color: '#8892a4' }, grid: { color: '#2a2d3a' }, ticks: { color: '#8892a4' } },
        y: { title: { display: true, text: 'sensor_15 (bypass pressure ratio)', color: '#8892a4' }, grid: { color: '#2a2d3a' }, ticks: { color: '#8892a4' } }
      }
    }
  });
}

// ============================================================
// ANIMATIONS
// ============================================================
function animateScore() {
  const numEl = document.getElementById('score-num');
  const fillEl = document.getElementById('score-fill');
  const decEl = document.getElementById('score-dec');
  if (!numEl) return;
  const start = 1.0, end = 0.0189;
  const dur = 1400;
  const t0 = performance.now();
  function frame(now) {
    const p = Math.min((now - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    const val = start + (end - start) * ease;
    numEl.textContent = val.toFixed(3);
    const pct = val * 100;
    fillEl.style.width = pct + '%';
    const col = p < 0.5 ? 'var(--yellow)' : 'var(--green)';
    numEl.style.color = col;
    fillEl.style.background = col;
    if (p < 1) requestAnimationFrame(frame);
    else {
      numEl.textContent = '0.019';
      numEl.style.color = 'var(--green)';
      fillEl.style.width = '1.9%';
      fillEl.style.background = 'var(--green)';
      decEl.textContent = 'OK — False alarm suppressed';
      decEl.style.color = 'var(--green)';
    }
  }
  setTimeout(() => requestAnimationFrame(frame), 300);
}

function animateCounter(id, target, dur) {
  const el = document.getElementById(id);
  if (!el) return;
  const t0 = performance.now();
  function frame(now) {
    const p = Math.min((now - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 4);
    el.textContent = Math.round(ease * target);
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = target;
  }
  requestAnimationFrame(frame);
}

function typewrite(id, text, delay) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  function next() {
    if (i >= text.length) {
      el.querySelector('.cursor')?.remove();
      return;
    }
    const cursor = el.querySelector('.cursor');
    const span = document.createTextNode(text[i]);
    el.insertBefore(span, cursor);
    i++;
    setTimeout(next, delay + Math.random() * 10);
  }
  setTimeout(next, 400);
}

// ============================================================
// MATH TOGGLE
// ============================================================
function toggleMath(id) {
  const panel = document.getElementById(id);
  const btn = panel.previousElementSibling;
  if (!panel || !btn) return;
  panel.classList.toggle('open');
  btn.classList.toggle('open');
}

// ============================================================
// KEYBOARD NAVIGATION
// ============================================================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextStep();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevStep();
});

// ============================================================
// INIT
// ============================================================
function init() {
  const hash = location.hash.replace('#', '');
  const match = hash.match(/step=(\d)/);
  const startStep = match ? Math.min(7, Math.max(1, parseInt(match[1]))) : 1;
  goToStep(startStep);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
